name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_QUERY_API_URL: ${{ vars.QUERY_API_URL || 'https://waiviodev.com' }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH || '' }}
          NEXT_PUBLIC_ODL_NETWORK: ${{ vars.ODL_NETWORK || 'odl-testnet' }}
          NEXT_PUBLIC_HIVE_CUSTOM_JSON_ID: ${{ vars.HIVE_CUSTOM_JSON_ID || 'odl-testnet' }}
          NEXT_PUBLIC_GOVERNANCE_OBJECT_ID: ${{ vars.GOVERNANCE_OBJECT_ID || 'governance-31abe670' }}
          NEXT_PUBLIC_ROOT_OBJECT_ID: ${{ vars.ROOT_OBJECT_ID || '6nltas-recipes' }}
          NEXT_PUBLIC_BASE_BUSINESS_OBJECT_ID: ${{ vars.BASE_BUSINESS_OBJECT_ID || 'ecy-hive-cooking' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
