name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_QUERY_API_URL: ${{ vars.QUERY_API_URL || 'https://api.hivecooking.com' }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH || '' }}
          NEXT_PUBLIC_ODL_NETWORK: ${{ vars.ODL_NETWORK || 'odl-testnet' }}
          NEXT_PUBLIC_HIVE_CUSTOM_JSON_ID: ${{ vars.HIVE_CUSTOM_JSON_ID || 'odl-testnet' }}
          NEXT_PUBLIC_GOVERNANCE_OBJECT_ID: ${{ vars.GOVERNANCE_OBJECT_ID || 'governance-31abe670' }}
          NEXT_PUBLIC_ROOT_OBJECT_ID: ${{ vars.ROOT_OBJECT_ID || '6nltas-recipes' }}
          NEXT_PUBLIC_BASE_BUSINESS_OBJECT_ID: ${{ vars.BASE_BUSINESS_OBJECT_ID || 'ecy-hive-cooking' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f4231b047e82f16c9b5b50ddffa99461' }}
          command: pages deploy out --project-name=hivecooking-dev --branch=main
